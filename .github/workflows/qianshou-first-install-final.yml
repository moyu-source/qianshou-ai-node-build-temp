name: Build and live-test Qianshou First Installer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qianshou-first-install-final.yml"

permissions:
  contents: read

concurrency:
  group: qianshou-final-first-installer
  cancel-in-progress: true

jobs:
  build-and-live-test:
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      PACKAGING_URL: https://xz.178u.cn/build-temp/qianshou-packaging-35fe67b2.tgz
      PACKAGING_SHA256: 35fe67b22e8a347f4713503cd290cacaf06de60649565ad603513f0221e10b66
      SIGNED_INSTALLER_URL: https://xz.178u.cn/build-temp/QianshouOpenClaw-Setup-x64-d3342a08.exe
      SIGNED_INSTALLER_SHA256: d3342a084dce01ea7016c83c3a38abec31085305838aef2af024c26586f0508f
      SIGNER_THUMBPRINT: FC8BF954B002AD313A7A38A92F3A28D9E867A100
      ROOT_THUMBPRINT: C96262AE2D3D99B2F322FFF52C1C645B9482BD98
      EXPECTED_PUBLISHER: Qianshou AI

    steps:
      - name: Check out workflow wrapper
        uses: actions/checkout@v7

      - name: Download verified packaging material
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "qianshou-packaging.tgz"
          Invoke-WebRequest -Uri $env:PACKAGING_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:PACKAGING_SHA256) {
            throw "Packaging checksum mismatch: $actual"
          }
          tar -xzf $archive -C $env:GITHUB_WORKSPACE

      - name: Verify visible publisher metadata contract
        shell: pwsh
        run: |
          $issPath = Join-Path $PWD "packaging\first-install\installer-first-run.iss"
          $iss = Get-Content -Raw -LiteralPath $issPath
          $required = @(
            "AppPublisher=Qianshou AI",
            "VersionInfoCompany=Qianshou AI",
            "VersionInfoDescription=Qianshou OpenClaw First Install",
            "PublisherCertificateSha1 = 'FC8BF954B002AD313A7A38A92F3A28D9E867A100'",
            '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=""startupicon""'
          )
          foreach ($contract in $required) {
            if (-not $iss.Contains($contract)) {
              throw "Missing first-install contract: $contract"
            }
          }

      - name: Download and verify signed core installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            .\packaging\first-install\payload, `
            .\packaging\first-install\Output | Out-Null
          $installer = Join-Path $PWD "packaging\first-install\payload\QianshouOpenClaw-Setup-x64.exe"
          Invoke-WebRequest -Uri $env:SIGNED_INSTALLER_URL -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:SIGNED_INSTALLER_SHA256) {
            throw "Signed installer hash mismatch: $actual"
          }

      - name: Verify Authenticode identity and timestamp
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "packaging\first-install\payload\QianshouOpenClaw-Setup-x64.exe"
          $certificatePath = Join-Path $PWD "packaging\first-install\certs\Qianshou-Internal-Publisher.cer"
          $publishedCertificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath)
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($publishedCertificate.Thumbprint -ne $env:SIGNER_THUMBPRINT) {
            throw "Published certificate thumbprint mismatch."
          }
          if ($publishedCertificate.GetNameInfo(
              [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false) -ne $env:EXPECTED_PUBLISHER) {
            throw "Visible publisher name is not the ASCII release name."
          }
          if ($publishedCertificate.Subject -match '[^\x20-\x7E]') {
            throw "Publisher subject contains non-ASCII characters."
          }
          if (-not $signature.SignerCertificate) {
            throw "The core installer has no Authenticode signer."
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:SIGNER_THUMBPRINT) {
            throw "Unexpected signer: $($signature.SignerCertificate.Thumbprint)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "The core installer has no trusted timestamp."
          }
          if ($signature.Status -in @("HashMismatch", "NotSigned", "NotSupported")) {
            throw "Invalid Authenticode envelope: $($signature.Status)"
          }

      - name: Install Inno Setup and Simplified Chinese language
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $languageDir = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $languageDir | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/cfdf48923178df4b4f040e038b423aa555a61ffc/Files/Languages/Unofficial/ChineseSimplified.isl" `
            -OutFile (Join-Path $languageDir "ChineseSimplified.isl")

      - name: Build one-click first installer
        shell: pwsh
        working-directory: .\packaging\first-install
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\installer-first-run.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Building the first installer failed."
          }
          $version = (Get-Item .\Output\QianshouOpenClaw-FirstInstall-x64.exe).VersionInfo
          if ($version.CompanyName.Trim() -ne $env:EXPECTED_PUBLISHER) {
            throw "Compiled first installer publisher mismatch: $($version.CompanyName)"
          }
          if ($version.FileDescription.Trim() -ne "Qianshou OpenClaw First Install") {
            throw "Compiled first installer description mismatch: $($version.FileDescription)"
          }

      - name: Exercise complete first-install flow
        shell: pwsh
        working-directory: .\packaging\first-install
        run: |
          $firstInstaller = Resolve-Path .\Output\QianshouOpenClaw-FirstInstall-x64.exe
          $process = Start-Process -FilePath $firstInstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "First installer exited with code $($process.ExitCode)."
          }
          $installedTray = Join-Path $env:LOCALAPPDATA "QianshouAINode\OpenClaw.Tray.WinUI.exe"
          if (-not (Test-Path -LiteralPath $installedTray)) {
            throw "Installed tray application was not found."
          }
          $root = Get-ChildItem Cert:\LocalMachine\Root |
            Where-Object Thumbprint -eq $env:ROOT_THUMBPRINT
          $publisher = Get-ChildItem Cert:\LocalMachine\TrustedPublisher |
            Where-Object Thumbprint -eq $env:SIGNER_THUMBPRINT
          if (-not $root -or -not $publisher) {
            throw "Internal trust certificates were not installed."
          }

      - name: Start installed app and verify live production enrollment
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "qianshou-live"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:OPENCLAW_TRAY_DATA_DIR = $dataDir
          $env:OPENCLAW_TRAY_TRACE = "1"
          $tray = Join-Path $env:LOCALAPPDATA "QianshouAINode\OpenClaw.Tray.WinUI.exe"
          $trayProcess = Start-Process -FilePath $tray -PassThru
          $statePath = Join-Path $dataDir "qianshou-enrollment.json"
          $settingsPath = Join-Path $dataDir "settings.json"
          $deadline = [DateTime]::UtcNow.AddSeconds(120)
          while ([DateTime]::UtcNow -lt $deadline -and
              (-not (Test-Path $statePath) -or -not (Test-Path $settingsPath))) {
            if ($trayProcess.HasExited) {
              throw "Installed app exited before completing live enrollment."
            }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $statePath) -or -not (Test-Path $settingsPath)) {
            throw "Installed app did not persist live enrollment state in time."
          }
          $state = Get-Content -Raw $statePath | ConvertFrom-Json
          $settings = Get-Content -Raw $settingsPath | ConvertFrom-Json
          if ($state.personnelNumber -notmatch '^\d+$') {
            throw "Live enrollment did not return a personnel number."
          }
          if ($state.bindingCode -notmatch '^\d{6}$') {
            throw "Live enrollment did not return a six-digit binding code."
          }
          if ($state.pollToken -notlike 'dpapi:*') {
            throw "Live enrollment token was not DPAPI protected."
          }
          if (-not $state.gatewayConfigured) {
            throw "The production gateway setup code was not applied."
          }
          if ($settings.gatewayUrl -ne "wss://xz.178u.cn/gateway/") {
            throw "The production gateway URL was not persisted."
          }
          if (-not $settings.enableNodeMode) {
            throw "Managed node mode was not enabled."
          }
          Start-Sleep -Seconds 20
          $logPath = Join-Path $dataDir "openclaw-tray.log"
          if (-not (Test-Path -LiteralPath $logPath)) {
            throw "The installed app did not create its connection log."
          }
          $log = Get-Content -Raw -LiteralPath $logPath
          $checks = [ordered]@{
            enrollment_error = $log -match '\[QianshouEnrollment\] enrollment failed'
            operator_handshake = $log -match 'Handshake succeeded'
            pairing_required = $log -match 'Pairing required|PairingRequired'
            node_connector_started = $log -match '\[NodeConnector\] Connecting'
            node_connected = $log -match 'Node status: Connected'
            authentication_failed = $log -match 'Authentication failed|AUTH_'
            bootstrap_invalid_or_expired = $log -match 'bootstrap token invalid or expired'
            device_token_mismatch = $log -match 'device token mismatch|AUTH_DEVICE_TOKEN_MISMATCH'
            signature_rejected = $log -match 'signature.*(invalid|rejected)|invalid.*signature'
            no_credential = $log -match 'No credential available'
            transport_failed = $log -match 'WebSocketError|Transport error|connect failed'
          }
          foreach ($entry in $checks.GetEnumerator()) {
            Write-Host "QIANSHOU_CONNECTION_CHECK $($entry.Key)=$($entry.Value)"
          }
          Write-Host "QIANSHOU_LIVE_E2E_READY enrollmentId=$($state.enrollmentId) personnel=$($state.personnelNumber)"
          Write-Host "Keeping the temporary Windows node online for remote operation checks."
          Start-Sleep -Seconds 300
          if ($trayProcess.HasExited) {
            throw "Installed app exited during remote operation checks."
          }
          Stop-Process -Id $trayProcess.Id -Force

      - name: Prepare verified artifact
        if: always()
        shell: pwsh
        working-directory: .\packaging\first-install
        run: |
          if (-not (Test-Path .\Output\QianshouOpenClaw-FirstInstall-x64.exe)) {
            throw "First-install output is missing."
          }
          Copy-Item .\payload\QianshouOpenClaw-Setup-x64.exe .\Output\QianshouOpenClaw-Setup-x64.exe
          Copy-Item .\certs\Qianshou-Internal-Root.cer .\Output\Qianshou-Internal-Root.cer
          Copy-Item .\certs\Qianshou-Internal-Publisher.cer .\Output\Qianshou-Internal-Publisher.cer
          $files = @(
            "QianshouOpenClaw-FirstInstall-x64.exe",
            "QianshouOpenClaw-Setup-x64.exe",
            "Qianshou-Internal-Root.cer",
            "Qianshou-Internal-Publisher.cer"
          )
          $lines = foreach ($name in $files) {
            $path = Join-Path $PWD "Output\$name"
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing output: $name"
            }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii .\Output\QianshouOpenClaw-Internal-SHA256SUMS.txt

      - name: Upload verified internal installer
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QianshouOpenClaw-Internal-Windows-x64
          path: |
            packaging/first-install/Output/QianshouOpenClaw-FirstInstall-x64.exe
            packaging/first-install/Output/QianshouOpenClaw-Setup-x64.exe
            packaging/first-install/Output/Qianshou-Internal-Root.cer
            packaging/first-install/Output/Qianshou-Internal-Publisher.cer
            packaging/first-install/Output/QianshouOpenClaw-Internal-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
